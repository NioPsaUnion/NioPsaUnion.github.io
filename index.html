<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSA Union</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/header/logo.svg" alt="PSA Union Logo">
            <span class="logo-name">PSA Union</span>
        </div>
        <nav>
            <ul>
                <li><a href="#home" class="active">Главная</a></li>
                <li><a href="#types">Виды</a></li>
                <li><a href="#articles">Статьи</a></li>
                <li><a href="#about">О нас</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <div class="container">
                <h1>Добро пожаловать в PSA Union</h1>
                <p>Ваш путеводитель в мире космоса.</p>
            </div>
        </section>

        <section id="types">
            <div class="container">
                <h2>Виды</h2>
                <div class="species">
                    <div class="species-card">
                        <div class="triangle-selector"></div>
                        <img src="images/types/2.png" alt="Персонаж 2">
                        <div class="triangle-selector triangle-bottom"></div>
                    </div>
                    <div class="species-card">
                        <div class="triangle-selector"></div>
                        <img src="images/types/2.png" alt="Персонаж 2">
                        <div class="triangle-selector triangle-bottom"></div>
                    </div>
                    <div class="species-card">
                        <div class="triangle-selector"></div>
                        <img src="images/types/2.png" alt="Персонаж 2">
                        <div class="triangle-selector triangle-bottom"></div>
                    </div>
                    <div class="species-card">
                        <div class="triangle-selector"></div>
                        <img src="images/types/2.png" alt="Персонаж 2">
                        <div class="triangle-selector triangle-bottom"></div>
                    </div>
                </div>
            </div>
        </section>

        <section id="articles">
            <div class="container">
                <h2>Выберите персонажа</h2>
            </div>
        </section>

        <section id="about">
            <div class="container">
                <h2>О нас</h2>
                <p>Мы - сообщество энтузиастов, исследующих глубины космоса и делящихся знаниями.</p>
            </div>
        </section>
    </main>

    <footer>
        PSA Union 2023-2025
    </footer>

    <script src="script.js"></script>
</body>
</html>
